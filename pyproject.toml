[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "github-onboarding-agent"
version = "0.1.0"
description = "A read-only GitHub repository onboarding agent built with smolagents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["smolagents>=1.0.0"]

[project.scripts]
github-agent = "github_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

